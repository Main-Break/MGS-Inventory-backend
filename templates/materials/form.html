{% extends "base.html" %}
{% block titulo %}Material{% endblock %}
{% block conteudo %}
    <h1 class="h3 mb-4">{{ "Editar material" if material and material.id else "Novo material" }}</h1>

    <div class="card" style="max-width: 520px;">
        <div class="card-body">
            {% if erro %}
            <div class="alert alert-danger">{{ erro }}</div>
            {% endif %}

            <form method="post" action="{{ '/app/materials/' ~ material.id ~ '/editar' if material and material.id else '/app/materials/novo' }}">
                <div class="mb-3">
                    <label for="code" class="form-label">Sigla</label>
                    <input type="text" class="form-control" id="code" name="code" maxlength="20" value="{{ material.code if material else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="name" name="name" maxlength="100" value="{{ material.name if material else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="density" class="form-label">Densidade (g/cm³)</label>
                    <input type="number" class="form-control" id="density" name="density" step="0.001" min="0.001" max="999" value="{{ material.density if material else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Observações</label>
                    <textarea class="form-control" id="description" name="description">{{ material.description if material else '' }}</textarea>
                </div>
                <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salvar</button>
                <a class="btn btn-outline-secondary" href="/app/materials">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
