<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Inventário por Foto</title>
    <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-split">
        <div class="login-banner">
            <div class="login-banner-overlay">
                <i class="bi bi-boxes login-banner-icone"></i>
                <img src="/static/logo-mgs.png" alt="MGS Plásticos" height="44" class="mb-4">
                <h1 class="h3 text-white">Inventário por Foto</h1>
                <p class="text-white-50">
                    Contagem de estoque assistida por visão computacional, com conferência
                    do gestor e evidência de cada verificação.
                </p>
            </div>
        </div>

        <div class="login-formulario">
            <form class="w-100" method="post" action="/app/login" style="max-width: 360px;">
                <h2 class="h4 mb-1">Entrar</h2>
                <p class="text-muted mb-4">Acesse com seu e-mail e senha cadastrados.</p>

                {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
