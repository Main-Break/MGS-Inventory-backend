{% extends "base.html" %}
{% block titulo %}Dashboard{% endblock %}
{% block conteudo %}
    <h1 class="h3 mb-4">Dashboard</h1>

    <div class="row g-3">
        <div class="col-md-4 col-sm-6">
            <div class="card cartao-kpi h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icone-kpi bg-primary-subtle text-primary"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="valor">{{ total_users }}</div>
                        <div class="rotulo">Usuários</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card cartao-kpi h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icone-kpi bg-info-subtle text-info"><i class="bi bi-bricks"></i></div>
                    <div>
                        <div class="valor">{{ total_materials }}</div>
                        <div class="rotulo">Materiais</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card cartao-kpi h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icone-kpi bg-success-subtle text-success"><i class="bi bi-box-seam"></i></div>
                    <div>
                        <div class="valor">{{ total_itens }}</div>
                        <div class="rotulo">Itens</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card cartao-kpi h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icone-kpi bg-secondary-subtle text-secondary"><i class="bi bi-camera"></i></div>
                    <div>
                        <div class="valor">{{ total_verifications }}</div>
                        <div class="rotulo">Verificações</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card cartao-kpi h-100 {{ 'border-warning' if total_pendentes > 0 else '' }}">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="icone-kpi bg-warning-subtle text-warning"><i class="bi bi-hourglass-split"></i></div>
                    <div>
                        <div class="valor">{{ total_pendentes }}</div>
                        <div class="rotulo">Pendentes de aprovação</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
